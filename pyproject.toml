[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homephone"
version = "0.1.0"
description = "A homephone for the internet age: a Raspberry Pi in a classic telephone that rings the whole household, built on Polkadot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "livekit>=1.0,<2",
  "numpy>=1.26",
  "pycryptodome>=3.19",
  "substrate-interface>=1.7,<2",
  "websockets>=13",
]

[project.optional-dependencies]
# Real hardware on the Pi: USB audio and GPIO hook switch.
pi = ["sounddevice>=0.5", "gpiozero>=2.0"]
# The token and ringing helper (runs on a laptop or a small server).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "livekit-api>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "homephone[server]"]

[project.scripts]
homephone = "homephone.phone.__main__:main"
homephone-server = "homephone.server.__main__:main"
homephone-identity = "homephone.identity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homephone = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
