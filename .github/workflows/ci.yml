name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in Docker, with a real LiveKit call
        run: docker compose --profile test run --rm test

  image:
    # Publishes the public build that compose.yaml pulls.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64, so it also runs on a Pi 4/5 or Apple Silicon)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/abutlabs/hearthline:latest
            ghcr.io/abutlabs/hearthline:${{ github.sha }}
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/abutlabs/hearthline:latest-test
