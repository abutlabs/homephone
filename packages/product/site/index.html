<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homephone</title>
<style>
  :root { --bg: #f6efe2; --ink: #2a1f1c; --red: #b0302a; --muted: #6d5d55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1714; --ink: #f1e8da; --red: #d8574e; --muted: #b3a597; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.5 Georgia, "Times New Roman", serif; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 30rem; text-align: center; }
  svg { width: 96px; height: 96px; }
  h1 { font-size: 2.2rem; margin: .4em 0 .1em; letter-spacing: .02em; }
  .tag { color: var(--red); font-style: italic; margin: 0 0 1.5em; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="var(--red)"/>
    <g fill="var(--bg)">
      <circle cx="80" cy="50" r="6.5"/><circle cx="74.3" cy="32.4" r="6.5"/><circle cx="59.3" cy="21.5" r="6.5"/>
      <circle cx="40.7" cy="21.5" r="6.5"/><circle cx="25.7" cy="32.4" r="6.5"/><circle cx="20" cy="50" r="6.5"/>
      <circle cx="25.7" cy="67.6" r="6.5"/><circle cx="40.7" cy="78.5" r="6.5"/><circle cx="59.3" cy="78.5" r="6.5"/>
      <circle cx="50" cy="50" r="13"/>
    </g>
  </svg>
  <h1>Homephone</h1>
  <p class="tag">A homephone for the internet age</p>
  <p>A classic rotary phone, connected to the Polkadot App, that rings the whole house. Coming soon.</p>
</main>
</body>
</html>
